services:
  setup-elk:
    build:
      context: ./setup
      dockerfile: Dockerfile
    container_name: elk-setup
    volumes:
      - elasticsearch_certs:/usr/share/elasticsearch/config/certs
    env_file:
      - .env
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD:-changeme}
    networks:
      - elk_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  elasticsearch:
    depends_on:
      setup-elk:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.2.2
    container_name: es01
    env_file:
      - .env
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - cluster.routing.allocation.disk.threshold_enabled=false
      - cluster.name=${CLUSTER_NAME:-transcendence}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.ml.enabled=false
      - indices.memory.index_buffer_size=10%
      - bootstrap.memory_lock=true
      - action.destructive_requires_name=true
      - thread_pool.write.queue_size=1000
      - thread_pool.search.queue_size=1000
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_certs:/usr/share/elasticsearch/config/certs
    networks:
      - elk_net
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: '2.0'
        reservations:
          memory: 1536M
          cpus: '0.50'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s --cacert config/certs/ca/ca.crt -u elastic:${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health | grep -vq ''"status":"red"''',
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana-wolfi:9.2.2
    container_name: kibana
    ports:
      - "5601:5601"
    env_file:
      - .env
    volumes:
      - elasticsearch_certs:/usr/share/kibana/config/certs
    environment:
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-changeme}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - SERVER_SSL_ENABLED=false
      - SERVER_SSL_CERTIFICATE=config/certs/kibana/kibana.crt
      - SERVER_SSL_KEY=config/certs/kibana/kibana.key
      - NODE_OPTIONS=--max-old-space-size=768
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup-elk:
        condition: service_completed_successfully
    networks:
      - elk_net
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I -k https://kibana.cookshare.me/api/status | grep 200",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  logstash:
    build:
      context: ./logstash
      dockerfile: Dockerfile
    container_name: logstash
    env_file:
      - .env
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - PIPELINE_WORKERS=2
      - PIPELINE_BATCH_SIZE=250
      - PIPELINE_BATCH_DELAY=50
    volumes:
      - ./logstash/conf/pipelines.yml:/usr/share/logstash/config/pipelines.yml:z
      - ./logstash/conf/syslog.conf:/usr/share/logstash/pipeline/syslog.conf:z
      - ./logstash/conf/file.conf:/usr/share/logstash/pipeline/file.conf:z
      - ../../logs:/var/log:ro,z
      - logstash_data:/usr/share/logstash/data:rw,z
      - elasticsearch_certs:/usr/share/logstash/config/certs
    ports:
      - "5140:5140/udp"
      - "5140:5140/tcp"
    command: >
      bash -c '
        /usr/share/logstash/bin/init.sh &&
        exec /usr/share/logstash/bin/logstash --config.reload.automatic
      '
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_healthy
    networks:
      - elk_net
      # - n_logs
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: '1.0'
        reservations:
          memory: 768M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9600/_node/stats/pipelines"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  elasticsearch_data:
    name: elk_data
  elasticsearch_certs:
    name: elk_certs
  logstash_data:
    name: logstash_data

networks:
  elk_net:
    name: elk_net
