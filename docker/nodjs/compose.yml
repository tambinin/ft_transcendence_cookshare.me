services:
  setup-nodjs:
    image: node:24-alpine
    container_name: setup-backend
    working_dir: /usr/src/app
    volumes:
      - ../../backend:/usr/src/app:rw,z
      - ./script/entrypoint.sh:/entrypoint.sh:z
    networks:
      - ft
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-f", "/usr/src/app/allset"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s

  common:
    image: node:24-alpine
    container_name: common
    working_dir: /usr/src/app
    volumes:
      - ../../backend:/usr/src/app:rw,z
    networks:
      - ft
    command: ["sh", "-c", "while [ ! -f /usr/src/app/allset ]; do sleep 1; done && npm run build:common"]
    depends_on:
      setup-nodjs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "common/dist/index.js"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api-gateway:
    image: node:24-alpine
    container_name: api-gateway
    working_dir: /usr/src/app/api-gateway
    volumes:
      - ../../backend:/usr/src/app:rw,z
      - vault-secrets:/vault/secrets:ro
      - ../../logs/api-gateway:/usr/src/app/api-gateway/logs:rw,z
      - ../../cybersecurity/certs:/certs:ro,z
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/cert.pem
    expose:
      - "3001"
    networks:
      - ft
    command: ["sh", "-c", "set -a && . /vault/secrets/api-gateway.env && set +a && npm run dev"]
    depends_on:
      common:
        condition: service_completed_successfully
      vault-agent-api-gateway:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--no-check-certificate", "--tries=1", "--spider", "https://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  recipe:
    image: node:24-alpine
    container_name: recipe
    working_dir: /usr/src/app/recipe-service
    volumes:
      - ../../backend:/usr/src/app:rw,z
      - vault-secrets:/vault/secrets:ro
      - ../../logs/recipe-service:/usr/src/app/recipe-service/logs:rw,z
      - ../../cybersecurity/certs:/certs:ro,z
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/cert.pem
    expose:
      - "3002"
    networks:
      - ft
    command: ["sh", "-c", "set -a && . /vault/secrets/recipe.env && set +a && npx prisma generate && npm run dev"]
    depends_on:
      common:
        condition: service_completed_successfully
      vault-agent-recipe:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--no-check-certificate", "--tries=1", "--spider", "https://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  auth:
    image: node:24-alpine
    container_name: auth
    working_dir: /usr/src/app/auth-service
    volumes:
      - ../../backend:/usr/src/app:rw,z
      - vault-secrets:/vault/secrets:ro
      - ../../logs/auth-service:/usr/src/app/auth-service/logs:rw,z
      - ../../cybersecurity/certs:/certs:ro,z
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/cert.pem
    expose:
      - "3003"
    networks:
      - ft
    command: ["sh", "-c", "set -a && . /vault/secrets/auth.env && set +a && npx prisma generate && npm run dev"]
    depends_on:
      common:
        condition: service_completed_successfully
      vault-agent-auth:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.35'
        reservations:
          memory: 96M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--no-check-certificate", "--tries=1", "--spider", "https://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  user:
    image: node:24-alpine
    container_name: user
    working_dir: /usr/src/app/user-service
    volumes:
      - ../../backend:/usr/src/app:rw,z
      - vault-secrets:/vault/secrets:ro
      - ../../logs/user-service:/usr/src/app/user-service/logs:rw,z
      - ../../cybersecurity/certs:/certs:ro,z
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/cert.pem
    expose:
      - "3004"
    networks:
      - ft
    command: ["sh", "-c", "set -a && . /vault/secrets/user.env && set +a && npx prisma generate && npm run dev"]
    depends_on:
      common:
        condition: service_completed_successfully
      vault-agent-user:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.35'
        reservations:
          memory: 96M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--no-check-certificate", "--tries=1", "--spider", "https://127.0.0.1:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  chat:
    image: node:24-alpine
    container_name: chat
    working_dir: /usr/src/app/chat-service
    volumes:
      - ../../backend:/usr/src/app:rw,z
      - vault-secrets:/vault/secrets:ro
      - ../../logs/chat-service:/usr/src/app/chat-service/logs:rw,z
      - ../../cybersecurity/certs:/certs:ro,z
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/cert.pem
    expose:
      - "3005"
    networks:
      - ft
    command: ["sh", "-c", "set -a && . /vault/secrets/chat.env && set +a && npx prisma generate && npm run dev"]
    depends_on:
      common:
        condition: service_completed_successfully
      vault-agent-chat:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.35'
        reservations:
          memory: 96M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--no-check-certificate", "--tries=1", "--spider", "https://127.0.0.1:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification:
    image: node:24-alpine
    container_name: notification
    working_dir: /usr/src/app/notification-service
    volumes:
      - ../../backend:/usr/src/app:rw,z
      - vault-secrets:/vault/secrets:ro
      - ../../logs/notification-service:/usr/src/app/notification-service/logs:rw,z
      - ../../cybersecurity/certs:/certs:ro,z
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/cert.pem
    expose:
      - "3006"
    networks:
      - ft
    command: ["sh", "-c", "set -a && . /vault/secrets/notification.env && set +a && npx prisma generate && npm run dev"]
    depends_on:
      common:
        condition: service_completed_successfully
      vault-agent-notification:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--no-check-certificate", "--tries=1", "--spider", "https://127.0.0.1:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  websocket:
    image: node:24-alpine
    container_name: websocket
    working_dir: /usr/src/app/websocket-service
    volumes:
      - ../../backend:/usr/src/app:rw,z
      - vault-secrets:/vault/secrets:ro
      - ../../logs/websocket-service:/usr/src/app/websocket-service/logs:rw,z
      - ../../cybersecurity/certs:/certs:ro,z
    environment:
      - NODE_EXTRA_CA_CERTS=/certs/cert.pem
    expose:
      - "3007"
    networks:
      - ft
    command: ["sh", "-c", "set -a && . /vault/secrets/websocket.env && set +a && npm run dev"]
    depends_on:
      common:
        condition: service_completed_successfully
      vault-agent-websocket:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.35'
        reservations:
          memory: 96M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--no-check-certificate", "--tries=1", "--spider", "https://127.0.0.1:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  front-end:
    image: node:24-alpine
    container_name: front-end
    working_dir: /usr/src/app
    volumes:
      - ../../frontend:/usr/src/app:rw,z
    environment:
      - VITE_API_URL=https://${DOMAIN:-cookshare.me}/api/v1
      - VITE_WS_URL=https://${DOMAIN:-cookshare.me}
      - VITE_APP_NAME=cookshare
      - VITE_DEBUG=true
      - VITE_API_TIMEOUT=30000
      - VITE_HMR_HOST=${DOMAIN:-cookshare.me}
      - NODE_OPTIONS=--max-old-space-size=768
    expose:
      - "5173"
    command: ["sh", "-c", "npm install && npm run dev"]
    networks:
      - ft
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.50'
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

