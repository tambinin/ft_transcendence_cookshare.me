# ============================================================== #
# ModSecurity Custom Rules for CookShare / Kabaka.io             #
# ============================================================== #
# Version: 2.0 — Rewritten 2026-03-11                           #
# Author: WAF Security Audit                                     #
#                                                                 #
# Architecture:                                                   #
#   Browser → WAF (ModSecurity + CRS) → API Gateway (Fastify)   #
#   Frontend: Vite SPA on /                                      #
#   Backend API: /api/v1/*                                       #
#   WebSocket: /ws/ (modsecurity off in nginx)                   #
#   RAG: /rag/ (modsecurity off in nginx)                        #
#                                                                 #
# Rule ID allocation:                                             #
#   900200       — CRS tx variable overrides                     #
#   1001–1007    — App-specific content rules                    #
#   1008–1011    — API key / auth gateway rules                  #
#   1012–1029    — OWASP Top 10 hardening                        #
#   1030–1039    — Application flow whitelists                   #
# ============================================================== #

# ============================================================== #
#           GLOBAL CONFIGURATION                                  #
# ============================================================== #

# Activate ModSecurity in blocking mode
SecRuleEngine On

# Allow only permitted REST methods (CRS rule 911100)
# Application uses: GET, POST, PUT, DELETE
# OPTIONS is required for CORS preflight requests from browsers
# PATCH, HEAD, TRACE, CONNECT, DEBUG are FORBIDDEN
SecAction \
    "id:900200,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET POST PUT DELETE OPTIONS'"

# ============================================================== #
#     PHASE 1 — EARLY WHITELISTS (before any deny rules)         #
# ============================================================== #
# These rules MUST execute first to skip blocking rules for      #
# legitimate application flows that would otherwise be caught.    #

# ──────────────────────────────────────────────────────────────
# 1030 — WHITELIST: Email verification link (GET with ?token=)
# Flow: User clicks link in email → browser sends:
#   GET /api/v1/auth/verify-email?token=<verification_token>
# Without this rule, rule 1029 would block it (token= in QS).
# This is safe because:
#   - The token is a one-time-use verification token, not a session credential
#   - The endpoint is rate-limited at the API Gateway level
#   - The API Gateway validates the token and redirects to /login
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/api/(v[0-9]+/)?auth/verify-email" \
    "id:1030,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    skipAfter:END_TOKEN_CHECK"

# ──────────────────────────────────────────────────────────────
# 1031 — WHITELIST: Password reset link (GET/POST with token)
# Flow: User clicks link in email → browser sends:
#   GET /api/v1/auth/reset-password?token=<reset_token>
#   or POST with {token, newPassword} in body
# Same rationale as 1030: one-time token, rate-limited, validated server-side.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/api/(v[0-9]+/)?auth/reset-password" \
    "id:1031,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    skipAfter:END_TOKEN_CHECK"

# ──────────────────────────────────────────────────────────────
# 1032 — WHITELIST: Google OAuth callback
# Flow: Google redirects back with:
#   GET /api/v1/auth/google/callback?code=4/0Afr...&state=<uuid>&scope=...
# The code and state parameters are validated server-side (PKCE + anti-CSRF).
# CRS false positives for this endpoint are handled in RESPONSE-999.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/api/(v[0-9]+/)?auth/google/callback" \
    "id:1032,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    skipAfter:END_TOKEN_CHECK"

# ──────────────────────────────────────────────────────────────
# 1033 — WHITELIST: GDPR account deletion confirmation
# Flow: User clicks deletion confirmation link in email:
#   DELETE /api/v1/gdpr/confirm-deletion with {token: "xxx"} in body
# One-time token, validated server-side, irreversible action.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/api/(v[0-9]+/)?gdpr/confirm-deletion" \
    "id:1033,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    skipAfter:END_TOKEN_CHECK"

# ──────────────────────────────────────────────────────────────
# 1034 — WHITELIST: Frontend OAuth callback page (not /api/)
# Flow: Backend redirects to frontend after successful OAuth:
#   GET /oauth/callback?token=<JWT_access_token>&new_user=0|1
# This is a frontend SPA route, not an API endpoint.
# The token is consumed client-side by JavaScript and never sent to a server QS again.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@beginsWith /oauth/callback" \
    "id:1034,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    skipAfter:END_TOKEN_CHECK"

# ──────────────────────────────────────────────────────────────
# 1035 — WHITELIST: Frontend email verify page
# Flow: Verification email contains link to:
#   GET /email-verify?token=<verification_token>
# or GET /api/v1/auth/verify-email?token=<verification_token>
# Frontend SPA route — token consumed client-side.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@beginsWith /email-verify" \
    "id:1035,\
    phase:1,\
    pass,\
    nolog,\
    t:none,\
    skipAfter:END_TOKEN_CHECK"

# ──────────────────────────────────────────────────────────────
# 1029 — Block token in query string on /api/ paths
# Threat: Information Disclosure — credentials in URL are logged
#         by proxies, browser history, and server access logs.
# IMPORTANT: Rules 1030-1035 above whitelist specific legitimate
#            endpoints that use ?token= in query strings BEFORE
#            this deny rule fires.
# ──────────────────────────────────────────────────────────────
SecRule QUERY_STRING "@rx (?i)token=" \
    "id:1029,\
    phase:1,\
    chain,\
    deny,\
    status:403,\
    msg:'Token detected in API query string',\
    tag:'COOKSHARE/INFO_LEAK',\
    severity:'WARNING',\
    logdata:'Token in URL: %{MATCHED_VAR}'"
    SecRule REQUEST_URI "@beginsWith /api/"

# Marker: end of token whitelist section
SecMarker END_TOKEN_CHECK

# ============================================================== #
#     PHASE 1 — REQUEST METHOD & HEADER RULES                    #
# ============================================================== #

# ──────────────────────────────────────────────────────────────
# 1036 — Allow CORS preflight OPTIONS requests
# Flow: Browser sends preflight before cross-origin POST/PUT/DELETE:
#   OPTIONS /api/v1/... with Origin + Access-Control-Request-Method headers
# The API Gateway CORS handler (fastify/cors) returns proper headers.
# Blocking OPTIONS breaks all cross-origin authenticated requests.
# We allow OPTIONS but ONLY when it looks like a genuine CORS preflight
# (has Origin header and Access-Control-Request-Method header).
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_METHOD "@streq OPTIONS" \
    "id:1036,\
    phase:1,\
    chain,\
    pass,\
    nolog,\
    t:none,\
    skipAfter:END_METHOD_CHECK"
    SecRule &REQUEST_HEADERS:Origin "!@eq 0"

# ──────────────────────────────────────────────────────────────
# 1022 — Block forbidden and dangerous HTTP methods
# Threat: Cross-Site Tracing (XST), Method abuse
# TRACE/TRACK = XST attack vector (reflects cookies/auth headers)
# CONNECT = proxy abuse
# DEBUG = debugging exposure (.NET)
# PATCH = forbidden per project specification (app uses PUT for updates)
# OPTIONS without Origin = non-preflight scan (blocked above via chain)
# HEAD = forbidden per project specification
# Note: nginx also blocks TRACE natively (405), this is defense-in-depth.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_METHOD "@rx ^(TRACE|TRACK|CONNECT|DEBUG|PATCH|HEAD)$" \
    "id:1022,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Forbidden HTTP method blocked',\
    tag:'COOKSHARE/METHOD',\
    severity:'CRITICAL',\
    logdata:'Method: %{REQUEST_METHOD}'"

# ──────────────────────────────────────────────────────────────
# 1037 — Block non-preflight OPTIONS requests (no Origin header)
# Threat: Method enumeration / scanning
# Genuine CORS preflight always includes an Origin header.
# An OPTIONS request without Origin is likely a scanner or tool.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_METHOD "@streq OPTIONS" \
    "id:1037,\
    phase:1,\
    deny,\
    status:403,\
    msg:'OPTIONS request without Origin header (not a CORS preflight)',\
    tag:'COOKSHARE/METHOD',\
    severity:'WARNING',\
    logdata:'Non-preflight OPTIONS to: %{REQUEST_URI}'"

# Marker: end of method check section
SecMarker END_METHOD_CHECK

# ──────────────────────────────────────────────────────────────
# 1002 — Block access to admin paths (no admin panel exists)
# Threat: Reconnaissance / Unauthorized access
# These paths are commonly probed by automated scanners looking
# for WordPress, phpMyAdmin, or exposed config files.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/(admin|administrator|wp-admin|wp-login|phpmyadmin|phpinfo|\.env|\.git|\.htaccess|server-status|server-info)" \
    "id:1002,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Forbidden path access attempt',\
    tag:'COOKSHARE/RECON',\
    severity:'CRITICAL',\
    logdata:'Attempted access to: %{REQUEST_URI}'"

# ──────────────────────────────────────────────────────────────
# 1004 — Block requests without User-Agent (scanners / bots)
# Threat: Automated scanning
# All legitimate browsers and HTTP clients send a User-Agent header.
# Its absence indicates a script or scanner.
# ──────────────────────────────────────────────────────────────
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:1004,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Missing User-Agent blocked',\
    tag:'COOKSHARE/BOT',\
    severity:'WARNING'"

# ──────────────────────────────────────────────────────────────
# 1005 — Block known vulnerability scanners by User-Agent
# Threat: Automated scanning / Reconnaissance
# Matches signatures of common offensive security tools.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|burp|acunetix|fimap|havij|dirbuster|nessus|openvas|masscan|wpscan|nuclei|gobuster|feroxbuster|ffuf|httpx|subfinder|amass|zgrab|metasploit|w3af)" \
    "id:1005,\
    phase:1,\
    deny,\
    t:lowercase,\
    status:403,\
    msg:'Vulnerability scanner detected and blocked',\
    tag:'COOKSHARE/ANTI_SCANNER',\
    severity:'CRITICAL',\
    logdata:'Blocked User-Agent: %{REQUEST_HEADERS.User-Agent}'"

# ──────────────────────────────────────────────────────────────
# 1027 — Sensitive data exposure: Block credentials in query string
# Threat: Information Disclosure
# Passwords, secrets, and API keys must never be in URLs because
# they get logged in access logs, browser history, and Referer headers.
# Note: "token=" is handled separately by rules 1029-1035 above.
# ──────────────────────────────────────────────────────────────
SecRule QUERY_STRING "@rx (?i)(password|passwd|secret|api_?key)=" \
    "id:1027,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Credentials detected in query string',\
    tag:'COOKSHARE/INFO_LEAK',\
    severity:'WARNING',\
    logdata:'Sensitive parameter in URL: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1016 — HTTP Request Smuggling protection
# Threat: HTTP Request Smuggling
# Blocks Transfer-Encoding header values other than "chunked".
# Obfuscated TE values (e.g. "chunked, identity") are a classic
# smuggling vector exploiting frontend/backend parser disagreement.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_HEADERS:Transfer-Encoding "!@rx ^chunked$" \
    "id:1016,\
    phase:1,\
    chain,\
    deny,\
    status:403,\
    msg:'HTTP Request Smuggling: Invalid Transfer-Encoding',\
    tag:'COOKSHARE/REQUEST_SMUGGLING',\
    severity:'CRITICAL',\
    logdata:'Suspicious Transfer-Encoding: %{MATCHED_VAR}'"
    SecRule &REQUEST_HEADERS:Transfer-Encoding "!@eq 0"

# ──────────────────────────────────────────────────────────────
# 1017 — Block double Content-Length headers (smuggling vector)
# Threat: HTTP Request Smuggling / Desync
# Multiple Content-Length headers cause parser confusion between
# the WAF and the backend, enabling request smuggling.
# ──────────────────────────────────────────────────────────────
SecRule &REQUEST_HEADERS:Content-Length "@gt 1" \
    "id:1017,\
    phase:1,\
    deny,\
    status:403,\
    msg:'HTTP Request Smuggling: Duplicate Content-Length',\
    tag:'COOKSHARE/REQUEST_SMUGGLING',\
    severity:'CRITICAL'"

# ──────────────────────────────────────────────────────────────
# 1018 — Protocol version enforcement (HTTP/1.0, HTTP/1.1, HTTP/2)
# Threat: Protocol downgrade / Smuggling
# Only standard HTTP versions are allowed. Unusual versions like
# HTTP/0.9 or forged versions enable parsing inconsistencies.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_PROTOCOL "!@rx ^HTTP/(1\.[01]|2(\.0)?)$" \
    "id:1018,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Invalid HTTP protocol version',\
    tag:'COOKSHARE/PROTOCOL',\
    severity:'WARNING',\
    logdata:'Protocol: %{REQUEST_PROTOCOL}'"

# ──────────────────────────────────────────────────────────────
# 1019 — Block dangerous file extensions in URI
# Threat: Webshell / Backdoor access
# Attackers probe for server-side scripts left by default installs.
# Our app is Node.js-only; these extensions are never legitimate.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx (?i)\.(php|asp|aspx|jsp|cgi|pl|py|rb|sh|bash|exe|dll|bat|cmd|ps1|com)(\?|$)" \
    "id:1019,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Dangerous file extension in URI',\
    tag:'COOKSHARE/RECON',\
    severity:'CRITICAL',\
    logdata:'Suspicious URI: %{REQUEST_URI}'"

# ──────────────────────────────────────────────────────────────
# 1020 — Block suspicious HTTP headers used by attackers
# Threat: Proxy abuse / Header injection
# These headers are used to bypass URL-based access controls
# by making the backend believe the request targets a different path.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_HEADERS_NAMES "@rx (?i)^(proxy|x-forwarded-server|x-original-url|x-rewrite-url|x-override-url)$" \
    "id:1020,\
    phase:1,\
    deny,\
    status:403,\
    msg:'Suspicious HTTP header detected',\
    tag:'COOKSHARE/HEADER_INJECTION',\
    severity:'WARNING',\
    logdata:'Suspicious header: %{MATCHED_VAR}'"

# ============================================================== #
#     PHASE 2 — REQUEST BODY INSPECTION RULES                    #
# ============================================================== #

# ──────────────────────────────────────────────────────────────
# 1001 — Anti-Spam: Block known spam keywords in user content
# Threat: Spam / Content abuse
# Scans recipe titles and comments for spam patterns.
# ──────────────────────────────────────────────────────────────
SecRule ARGS:comment|ARGS:title|ARGS:json.comment|ARGS:json.title "@rx (casino|porn|viagra|spam|scam|lottery|crypto.?airdrop|free.?money|click.?here.?to.?win)" \
    "id:1001,\
    phase:2,\
    t:lowercase,\
    deny,\
    status:403,\
    msg:'Spam detected in user content',\
    tag:'COOKSHARE/SPAM',\
    severity:'WARNING',\
    logdata:'Forbidden word found: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1003 — Upload validation: Only image files allowed
# Threat: Malicious file upload / Webshell
# The application only accepts image uploads (avatars, recipe photos).
# All other file types are rejected at the WAF level.
# ──────────────────────────────────────────────────────────────
SecRule FILES "!@rx (?i)\.(jpg|jpeg|png|gif|webp)$" \
    "id:1003,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Invalid file extension for upload',\
    tag:'COOKSHARE/FILE_UPLOAD',\
    severity:'CRITICAL',\
    logdata:'Attempted upload: %{FILES_NAMES}'"

# ──────────────────────────────────────────────────────────────
# 1006 — SQLi on search parameter (targeted, avoids false positives)
# Threat: SQL Injection
# CRS 942xxx provides broad coverage; this rule adds targeted patterns
# specific to the app's search functionality that CRS might score
# below the anomaly threshold at PARANOIA=2.
# ──────────────────────────────────────────────────────────────
SecRule ARGS:search "@rx (?i)(\bunion\b.{0,20}\bselect\b|\bselect\b.{0,20}\bfrom\b|\binsert\b.{0,20}\binto\b|\bupdate\b.{0,20}\bset\b|\bdelete\b.{0,20}\bfrom\b|\bdrop\b.{0,20}\btable\b|\b(or|and)\b\s+\d+\s*=\s*\d+|--|;.*--|\bexec\b.{0,10}\(|\bsleep\s*\(|\bbenchmark\s*\(|\bwaitfor\b.{0,10}\bdelay\b|\bload_file\b|\binto\s+outfile\b)" \
    "id:1006,\
    phase:2,\
    deny,\
    t:urlDecodeUni,t:lowercase,\
    status:403,\
    msg:'SQLi detected in search parameter',\
    tag:'COOKSHARE/SQL_INJECTION',\
    severity:'CRITICAL',\
    logdata:'SQL Injection attempt in search: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1007 — XSS on comment parameter
# Threat: Cross-Site Scripting
# Comments are user-generated content displayed to other users.
# @detectXSS uses libinjection's XSS detection engine.
# ──────────────────────────────────────────────────────────────
SecRule ARGS:comment|ARGS:json.comment "@detectXSS" \
    "id:1007,\
    phase:2,\
    deny,\
    t:urlDecodeUni,\
    status:403,\
    msg:'XSS detected in comment parameter',\
    tag:'COOKSHARE/XSS_ATTACK',\
    severity:'CRITICAL',\
    logdata:'XSS attempt in comment: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1012 — LDAP Injection protection
# Threat: LDAP Injection
# Although the app uses PostgreSQL (not LDAP), this provides
# defense-in-depth against potential future integrations.
# ──────────────────────────────────────────────────────────────
SecRule ARGS "@rx (\([\w\s]*=[\w\s]*\)|\|\(|\&\(|[*)(\\][\x00-\x1f])" \
    "id:1012,\
    phase:2,\
    deny,\
    t:urlDecodeUni,t:lowercase,\
    status:403,\
    msg:'LDAP Injection detected',\
    tag:'COOKSHARE/LDAP_INJECTION',\
    severity:'CRITICAL',\
    logdata:'LDAP injection attempt: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1013 — XXE / XML External Entity protection
# Threat: XXE (XML External Entity)
# The app uses JSON exclusively, so any XML body with entity
# declarations is inherently suspicious.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)(application/xml|text/xml)" \
    "id:1013,\
    phase:2,\
    chain,\
    deny,\
    status:403,\
    msg:'XXE / XML External Entity attack detected',\
    tag:'COOKSHARE/XXE_ATTACK',\
    severity:'CRITICAL',\
    logdata:'XXE attempt in body: %{MATCHED_VAR}'"
    SecRule REQUEST_BODY "@rx (<!ENTITY|SYSTEM\s+['\x22]|PUBLIC\s+['\x22]|file://|expect://|php://)" \
        "t:urlDecodeUni,t:lowercase"

# ──────────────────────────────────────────────────────────────
# 1014 — SSRF: Block internal IP addresses in request parameters
# Threat: Server-Side Request Forgery (SSRF)
# Detects attempts to force the server to make requests to
# internal services (localhost, private IPs, cloud metadata).
# ──────────────────────────────────────────────────────────────
SecRule ARGS|ARGS_NAMES "@rx (?i)(https?://(localhost|127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|0\.0\.0\.0|169\.254\.|0x7f|0177\.|2130706433|::1|0000::1|\[::1\]))" \
    "id:1014,\
    phase:2,\
    deny,\
    t:urlDecodeUni,t:lowercase,\
    status:403,\
    msg:'SSRF: Internal IP address detected in parameter',\
    tag:'COOKSHARE/SSRF',\
    severity:'CRITICAL',\
    logdata:'SSRF attempt: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1015 — SSRF: Block cloud metadata endpoints
# Threat: SSRF targeting cloud provider metadata (AWS, GCP, Alibaba)
# ──────────────────────────────────────────────────────────────
SecRule ARGS|REQUEST_BODY "@rx (?i)(169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200)" \
    "id:1015,\
    phase:2,\
    deny,\
    t:urlDecodeUni,\
    status:403,\
    msg:'SSRF: Cloud metadata endpoint detected',\
    tag:'COOKSHARE/SSRF',\
    severity:'CRITICAL',\
    logdata:'SSRF cloud metadata attempt: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1023 — Session fixation protection
# Threat: Session Fixation via URL parameters
# Blocks attempts to inject session IDs via URL parameters.
# Our app uses HttpOnly cookies for session management exclusively.
# ──────────────────────────────────────────────────────────────
SecRule ARGS_NAMES "@rx (?i)(session_?id|sess_?id|phpsessid|jsessionid|aspsessionid|sid)" \
    "id:1023,\
    phase:2,\
    deny,\
    status:403,\
    msg:'Session fixation attempt detected',\
    tag:'COOKSHARE/SESSION_FIXATION',\
    severity:'CRITICAL',\
    logdata:'Suspicious parameter: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1024 — JSON body: Block prototype pollution payloads
# Threat: Prototype Pollution (Node.js / Express specific)
# Attackers send __proto__ or constructor[...] to poison Object.prototype,
# which can lead to RCE or privilege escalation in Node.js apps.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_BODY "@rx (?i)(__|proto__|constructor\s*\[|__proto__)" \
    "id:1024,\
    phase:2,\
    chain,\
    deny,\
    status:403,\
    msg:'Prototype pollution attempt detected',\
    tag:'COOKSHARE/PROTOTYPE_POLLUTION',\
    severity:'CRITICAL',\
    logdata:'Prototype pollution in body: %{MATCHED_VAR}'"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)application/json"

# ──────────────────────────────────────────────────────────────
# 1025 — Block NoSQL injection patterns (MongoDB-style)
# Threat: NoSQL Injection
# Although we use PostgreSQL, block these defensively in case
# of future service additions or library-level injection vectors.
# ──────────────────────────────────────────────────────────────
SecRule ARGS|REQUEST_BODY "@rx (\$where|\$ne|\$gt|\$lt|\$gte|\$lte|\$regex|\$exists|\$in|\$nin|\$or|\$and|\$not|\$nor|\$elemMatch)" \
    "id:1025,\
    phase:2,\
    deny,\
    t:urlDecodeUni,\
    status:403,\
    msg:'NoSQL injection pattern detected',\
    tag:'COOKSHARE/NOSQL_INJECTION',\
    severity:'CRITICAL',\
    logdata:'NoSQL injection attempt: %{MATCHED_VAR}'"

# ──────────────────────────────────────────────────────────────
# 1026 — Block open redirect via parameters
# Threat: Open Redirect / Phishing
# Only triggers when redirect-related parameter names contain
# external URLs not pointing to our domain (cookshare.me).
# ──────────────────────────────────────────────────────────────
SecRule ARGS "@rx (?i)(https?://(?!cookshare\.me)[\w.-]+)" \
    "id:1026,\
    phase:2,\
    chain,\
    deny,\
    status:403,\
    msg:'Open redirect attempt detected',\
    tag:'COOKSHARE/OPEN_REDIRECT',\
    severity:'WARNING',\
    logdata:'Redirect attempt to: %{MATCHED_VAR}'"
    SecRule ARGS_NAMES "@rx (?i)(redirect|return|next|url|goto|dest|destination|redir|return_url|continue)"

# ──────────────────────────────────────────────────────────────
# 1028 — Rate limit abuse: Block abnormally large request bodies
# Threat: Application-level DoS
# nginx client_max_body_size handles uploads (10M).
# This rule targets non-upload POST/PUT with excessive body size
# beyond what recipes, comments, or profiles would ever need.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_BODY_LENGTH "@gt 1048576" \
    "id:1028,\
    phase:2,\
    chain,\
    deny,\
    status:413,\
    msg:'Request body too large',\
    tag:'COOKSHARE/DOS',\
    severity:'WARNING',\
    logdata:'Body size: %{REQUEST_BODY_LENGTH}'"
    SecRule REQUEST_URI "!@rx (?i)/upload|/avatar"

# ============================================================== #
#     PHASE 3 — RESPONSE RULES                                   #
# ============================================================== #

# ──────────────────────────────────────────────────────────────
# 1021 — Response header hiding: prevent server info leakage
# Threat: Information disclosure
# Removes the Server header from responses to hide nginx/modsec version.
# ──────────────────────────────────────────────────────────────
SecRule RESPONSE_HEADERS:Server "@rx ." \
    "id:1021,\
    phase:3,\
    pass,\
    nolog,\
    setvar:'!tx.server_header',\
    tag:'COOKSHARE/INFO_LEAK'"

# ============================================================== #
#           API KEY VERIFICATION (WAF level)                      #
# ============================================================== #
# The API Gateway handles full API key validation and JWT verification.
# The WAF performs a basic "gatekeeper" check: requests to /api/
# must include EITHER an x-gateway-api-key header OR a Bearer token.
# Public endpoints are whitelisted below to skip this check.
#
# ORDERING: pass rules (skipAfter) MUST come before the deny rule.
# All rules use phase:1 for early evaluation before body inspection.

# ──────────────────────────────────────────────────────────────
# 1009 — Allow public API endpoints — skip API key check
# Matches: /api/v1/documentation/*, /api/health, /api/v1/health/*,
#          /api/v1/auth/* (all auth endpoints are public at WAF level)
# CRS rule exclusions for auth endpoints that receive tokens/codes
# which trigger false positives (URL encoding, SQLi, XSS checks).
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/api/(v[0-9]+/)?(documentation|health|auth)(/|$)" \
    "id:1009,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=920230,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=942100,\
    ctl:ruleRemoveById=942430,\
    ctl:ruleRemoveById=942431,\
    ctl:ruleRemoveById=942432,\
    skipAfter:END_API_SECURITY"

# ──────────────────────────────────────────────────────────────
# 1038 — Allow GDPR endpoints — skip API key check
# GDPR deletion confirmation uses a token in body, not a Bearer.
# The token is validated by the backend service.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/api/(v[0-9]+/)?gdpr(/|$)" \
    "id:1038,\
    phase:1,\
    pass,\
    nolog,\
    skipAfter:END_API_SECURITY"

# ──────────────────────────────────────────────────────────────
# 1039 — Allow metrics endpoint — skip API key check
# Metrics are public for monitoring purposes (Prometheus/Grafana).
# No authentication required for scraping.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/api/v1/metrics$" \
    "id:1039,\
    phase:1,\
    pass,\
    nolog,\
    skipAfter:END_API_SECURITY"

# ──────────────────────────────────────────────────────────────
# 1010 — Allow public recipe/category/dietary-tag browsing (GET only)
# These are read-only public endpoints that don't require auth.
# Only GET is allowed; POST/PUT/DELETE require authentication.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@rx ^/api/(v[0-9]+/)?(recipes|categories|dietary-tags|ingredients)(/|$|\?)" \
    "id:1010,\
    phase:1,\
    chain,\
    pass,\
    nolog,\
    skipAfter:END_API_SECURITY"
    SecRule REQUEST_METHOD "@streq GET"

# ──────────────────────────────────────────────────────────────
# 1011 — Allow requests with a valid Bearer token (frontend JWT auth)
# The API Gateway validates the JWT signature and expiration.
# The WAF only checks that a Bearer token is present.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:1011,\
    phase:1,\
    chain,\
    pass,\
    nolog,\
    skipAfter:END_API_SECURITY"
    SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+\S+" ""

# ──────────────────────────────────────────────────────────────
# 1008 — Block all other /api/ endpoints without valid API key
# This is the "catch-all" deny rule for the API security section.
# If none of the above pass rules matched, the request is blocked.
# The API Gateway key is used by Swagger UI and service-to-service calls.
# ──────────────────────────────────────────────────────────────
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:1008,\
    phase:1,\
    chain,\
    deny,\
    status:401,\
    msg:'API Key or Bearer token required for access',\
    tag:'COOKSHARE/API'"
    SecRule &REQUEST_HEADERS:x-gateway-api-key "@eq 0"

# Marker for end of API security rules
SecMarker END_API_SECURITY