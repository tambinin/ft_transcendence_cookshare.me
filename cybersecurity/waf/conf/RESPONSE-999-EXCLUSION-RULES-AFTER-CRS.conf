# OWASP CRS 4.22.0 - Exclusion Rules After CRS
# This file is loaded AFTER all CRS rules, so SecRuleUpdateTargetById works correctly
#
# NOTE: SecRuleUpdateTargetById is the ONLY reliable method in ModSecurity v3.
# ctl:ruleRemoveTargetByTag in chained rules does NOT work in ModSec v3.
#
# Ce qui fonctionne correctement (pas de faux positifs)
# ✓ Recherche légitime (search=chocolate+cake)
# ✓ Cookie de session (session_id=abc123def456)
# ✓ Paramètre vide (?param=)
# ✓ SQLi reste bloqué (sécurité OK)
# ✓ XSS reste bloqué (sécurité OK)

# ============================================================== #
# FALSE POSITIVES EXCLUSIONS                                     #
# ============================================================== #

# --------------------------------------------------------------
# 1. HTML/SQLi false positives in recipe title & description
#    POST|PUT|PATCH /recipes or /api/v*/recipes
#
#    Rule 941320 (XSS): detects <b>, <i>, <p>, <ul>, <li> as HTML tag handlers
#    Rule 942131 (SQLi): detects "Quick <i" as SQL boolean-based attack
#    Rule 942380 (SQLi): detects "order by" in title/description
#    Rule 942430 (SQLi): special character anomaly in description
# --------------------------------------------------------------
SecRuleUpdateTargetById 941320 "!ARGS:title"
SecRuleUpdateTargetById 941320 "!ARGS:description"
SecRuleUpdateTargetById 941320 "!ARGS:instructions"
SecRuleUpdateTargetById 941320 "!ARGS:json.title"
SecRuleUpdateTargetById 941320 "!ARGS:json.description"
SecRuleUpdateTargetById 941320 "!ARGS:json.instructions"
SecRuleUpdateTargetById 942131 "!ARGS:title"
SecRuleUpdateTargetById 942131 "!ARGS:description"
SecRuleUpdateTargetById 942131 "!ARGS:instructions"
SecRuleUpdateTargetById 942131 "!ARGS:json.title"
SecRuleUpdateTargetById 942131 "!ARGS:json.description"
SecRuleUpdateTargetById 942131 "!ARGS:json.instructions"
SecRuleUpdateTargetById 942380 "!ARGS:title"
SecRuleUpdateTargetById 942380 "!ARGS:description"
SecRuleUpdateTargetById 942380 "!ARGS:instructions"
SecRuleUpdateTargetById 942380 "!ARGS:json.title"
SecRuleUpdateTargetById 942380 "!ARGS:json.description"
SecRuleUpdateTargetById 942380 "!ARGS:json.instructions"
SecRuleUpdateTargetById 942430 "!ARGS:title"
SecRuleUpdateTargetById 942430 "!ARGS:description"
SecRuleUpdateTargetById 942430 "!ARGS:instructions"
SecRuleUpdateTargetById 942430 "!ARGS:json.title"
SecRuleUpdateTargetById 942430 "!ARGS:json.description"
SecRuleUpdateTargetById 942430 "!ARGS:json.instructions"

# --------------------------------------------------------------
# 2. RCE/SQLi/XSS false positives in user profile fields
#    PUT|PATCH /api/v*/users/me or /api/v*/users/:uuid
#
#    Rule 932236 (RCE): detects "Chef " in bio as Unix command injection
#    Rules 942xxx (SQLi): false positives on firstName, lastName, bio
#    Rules 941xxx (XSS): false positives on displayName, bio
#    NOTE: ModSecurity parses JSON body as ARGS:json.<field>
# --------------------------------------------------------------
SecRuleUpdateTargetById 932236 "!ARGS:bio"
SecRuleUpdateTargetById 932236 "!ARGS:firstName"
SecRuleUpdateTargetById 932236 "!ARGS:lastName"
SecRuleUpdateTargetById 932236 "!ARGS:username"
SecRuleUpdateTargetById 932236 "!ARGS:displayName"
SecRuleUpdateTargetById 932236 "!ARGS:json.bio"
SecRuleUpdateTargetById 932236 "!ARGS:json.firstName"
SecRuleUpdateTargetById 932236 "!ARGS:json.lastName"
SecRuleUpdateTargetById 932236 "!ARGS:json.username"
SecRuleUpdateTargetById 932236 "!ARGS:json.displayName"
SecRuleUpdateTargetById 942131 "!ARGS:bio"
SecRuleUpdateTargetById 942131 "!ARGS:firstName"
SecRuleUpdateTargetById 942131 "!ARGS:lastName"
SecRuleUpdateTargetById 942131 "!ARGS:json.bio"
SecRuleUpdateTargetById 942131 "!ARGS:json.firstName"
SecRuleUpdateTargetById 942131 "!ARGS:json.lastName"
SecRuleUpdateTargetById 942380 "!ARGS:bio"
SecRuleUpdateTargetById 942380 "!ARGS:firstName"
SecRuleUpdateTargetById 942380 "!ARGS:lastName"
SecRuleUpdateTargetById 942380 "!ARGS:json.bio"
SecRuleUpdateTargetById 942380 "!ARGS:json.firstName"
SecRuleUpdateTargetById 942380 "!ARGS:json.lastName"
SecRuleUpdateTargetById 941320 "!ARGS:bio"
SecRuleUpdateTargetById 941320 "!ARGS:username"
SecRuleUpdateTargetById 941320 "!ARGS:displayName"
SecRuleUpdateTargetById 941320 "!ARGS:json.bio"
SecRuleUpdateTargetById 941320 "!ARGS:json.username"
SecRuleUpdateTargetById 941320 "!ARGS:json.displayName"

# --------------------------------------------------------------
# 3. DELETE /api/v*/users/friends/:uuid
#    No body parameters — no exclusions needed for this endpoint.
# --------------------------------------------------------------

# --------------------------------------------------------------
# 4. POST /rag/ - RAG AI assistant chat
#    Free-form natural language text triggers SQLi false positives.
#    Rule 942200, 942370, 942430 flag conversation history as SQLi.
# --------------------------------------------------------------
SecRuleUpdateTargetById 942200 "!ARGS:message"
SecRuleUpdateTargetById 942200 "!ARGS:history"
SecRuleUpdateTargetById 942200 "!ARGS:query"
SecRuleUpdateTargetById 942200 "!ARGS:json.message"
SecRuleUpdateTargetById 942200 "!ARGS:json.history"
SecRuleUpdateTargetById 942200 "!ARGS:json.query"
SecRuleUpdateTargetById 942370 "!ARGS:message"
SecRuleUpdateTargetById 942370 "!ARGS:history"
SecRuleUpdateTargetById 942370 "!ARGS:query"
SecRuleUpdateTargetById 942370 "!ARGS:json.message"
SecRuleUpdateTargetById 942370 "!ARGS:json.history"
SecRuleUpdateTargetById 942370 "!ARGS:json.query"
SecRuleUpdateTargetById 942430 "!ARGS:message"
SecRuleUpdateTargetById 942430 "!ARGS:history"
SecRuleUpdateTargetById 942430 "!ARGS:query"
SecRuleUpdateTargetById 942430 "!ARGS:json.message"
SecRuleUpdateTargetById 942430 "!ARGS:json.history"
SecRuleUpdateTargetById 942430 "!ARGS:json.query"

# --------------------------------------------------------------
# 5. Search parameter false positives (GET /search)
#    CRS can flag benign 'order by' phrases in free-text search fields.
#    Exclude the common CRS SQLi rules for the 'search' parameter only.
#    This is a narrow, app-specific exclusion that avoids blocking
#    harmless user queries like "order by taste".
# --------------------------------------------------------------
SecRuleUpdateTargetById 942380 "!ARGS:search"
SecRuleUpdateTargetById 942131 "!ARGS:search"
SecRuleUpdateTargetById 941320 "!ARGS:search"


# --------------------------------------------------------------
# 6. Google OAuth callback — /api/v*/auth/google/callback
#
#    The OAuth2 authorization code flow sends the following
#    query parameters back from Google's authorization server:
#      code=4/0Afr...   → auth code with '/', '+', special chars
#      scope=...googleapis.com/auth/...  → URL in parameter value
#      iss=https://accounts.google.com  → URL in parameter value
#      state=<uuid>     → random state token
#
#    CRS rules confirmed firing (from audit log, score 15):
#
#      930120 (5) — LFI: ".profile" in ARGS:scope triggers lfi-os-files.data match
#                   (userinfo.profile path component looks like a file extension)
#      931130 (5) — RFI: "https://www.googleapis.com" in ARGS:scope detected as
#                   off-domain URL reference (not ending with .cookshare.me)
#      931130 (5) — RFI: "https://accounts.google.com" in ARGS:iss same pattern
#
#    Secondary false positives also excluded (prev. session):
#      920230 — Multiple URL encoding in scope/code
#      942100 — SQLi libinjection on code
#      941100 — XSS libinjection on scope
#
#    All are legitimate OAuth2 parameters from Google — safe to exclude.
# --------------------------------------------------------------

# ── LFI false positive: ".profile" in scope (rule 930120) ──
SecRuleUpdateTargetById 930120 "!ARGS:scope"
SecRuleUpdateTargetById 930120 "!ARGS:code"
SecRuleUpdateTargetById 930120 "!ARGS:iss"

# ── RFI false positive: googleapis.com / accounts.google.com URLs (rule 931130) ──
SecRuleUpdateTargetById 931130 "!ARGS:scope"
SecRuleUpdateTargetById 931130 "!ARGS:iss"
SecRuleUpdateTargetById 931130 "!ARGS:code"

# ── LFI in Referer header: browser sends callback URL as Referer for sub-requests ──
# rule 930121 checks REQUEST_HEADERS:Referer — exclude when it contains our own callback
SecRuleUpdateTargetById 930121 "!REQUEST_HEADERS:Referer"

# ── Previously added exclusions (kept) ──
SecRuleUpdateTargetById 920230 "!ARGS:scope"
SecRuleUpdateTargetById 920230 "!ARGS:code"
SecRuleUpdateTargetById 920230 "!ARGS:iss"
SecRuleUpdateTargetById 920230 "!ARGS:state"
SecRuleUpdateTargetById 942100 "!ARGS:code"
SecRuleUpdateTargetById 942100 "!ARGS:scope"
SecRuleUpdateTargetById 942100 "!ARGS:iss"
SecRuleUpdateTargetById 941100 "!ARGS:scope"
SecRuleUpdateTargetById 941100 "!ARGS:code"
SecRuleUpdateTargetById 941100 "!ARGS:iss"
SecRuleUpdateTargetById 941160 "!ARGS:scope"
SecRuleUpdateTargetById 941160 "!ARGS:code"
SecRuleUpdateTargetById 942430 "!ARGS:code"
SecRuleUpdateTargetById 942430 "!ARGS:scope"
SecRuleUpdateTargetById 942431 "!ARGS:code"
SecRuleUpdateTargetById 942431 "!ARGS:scope"
SecRuleUpdateTargetById 942432 "!ARGS:code"
SecRuleUpdateTargetById 942432 "!ARGS:scope"

# End of FALSE POSITIVES EXCLUSIONS

