    <script>
      (function() {
        ['log','warn','info'].forEach(function(m) {
          var orig = console[m];
          console[m] = function() {
            if (typeof arguments[0] === 'string' && arguments[0].indexOf('React DevTools') !== -1) return;
            orig.apply(console, arguments);
          };
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && e.reason.message && e.reason.message.indexOf('message channel closed') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
